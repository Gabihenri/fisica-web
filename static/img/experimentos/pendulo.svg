<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Esquema do pêndulo simples com smartphone</title>
  <desc id="desc">Suporte horizontal, ponto de suspensão, fio de comprimento L, corpo do pêndulo em equilíbrio e nas duas amplitudes máximas, arco da trajetória e ângulo inicial theta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#082b55"/><stop offset="1" stop-color="#15558f"/></linearGradient>
    <linearGradient id="mass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dceeff"/><stop offset="1" stop-color="#4c8fd0"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#35b779"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8bd7ff"/></marker>
  </defs>
  <rect width="800" height="520" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="764" height="484" rx="22" fill="none" stroke="#8bd7ff" stroke-opacity=".45" stroke-width="2"/>

  <text x="42" y="58" fill="#ffffff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Pêndulo com smartphone</text>
  <text x="42" y="88" fill="#d9e8f7" font-family="Arial,sans-serif" font-size="17">Esquema de montagem e grandezas medidas</text>

  <!-- suporte -->
  <rect x="235" y="115" width="330" height="22" rx="8" fill="#d7e2ec"/>
  <rect x="390" y="137" width="20" height="35" fill="#d7e2ec"/>
  <circle cx="400" cy="178" r="9" fill="#35b8e8" stroke="#fff" stroke-width="3"/>
  <text x="238" y="109" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Suporte</text>
  <text x="418" y="176" fill="#d9e8f7" font-family="Arial,sans-serif" font-size="15">ponto de suspensão</text>

  <!-- trajectory -->
  <path d="M205 390 Q400 510 595 390" fill="none" stroke="#8bd7ff" stroke-width="4" stroke-dasharray="12 10"/>
  <path d="M205 390 Q400 510 595 390" fill="none" stroke="#35b779" stroke-width="2" stroke-opacity=".45"/>

  <!-- left amplitude -->
  <line x1="400" y1="178" x2="205" y2="390" stroke="#c9d9e8" stroke-width="7"/>
  <circle cx="205" cy="390" r="28" fill="url(#mass)" stroke="#ffffff" stroke-width="3"/>
  <text x="92" y="423" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Amplitude máxima</text>
  <text x="136" y="447" fill="#d9e8f7" font-family="Arial,sans-serif" font-size="15">−θₘ</text>

  <!-- equilibrium -->
  <line x1="400" y1="178" x2="400" y2="398" stroke="#ffffff" stroke-width="7"/>
  <circle cx="400" cy="398" r="31" fill="#2f7fc2" stroke="#ffffff" stroke-width="3"/>
  <text x="338" y="452" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Posição de equilíbrio</text>

  <!-- right amplitude -->
  <line x1="400" y1="178" x2="595" y2="390" stroke="#ffffff" stroke-width="7"/>
  <circle cx="595" cy="390" r="28" fill="url(#mass)" stroke="#ffffff" stroke-width="3"/>
  <text x="590" y="423" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Amplitude máxima</text>
  <text x="646" y="447" fill="#d9e8f7" font-family="Arial,sans-serif" font-size="15">+θₘ</text>

  <!-- length -->
  <line x1="430" y1="188" x2="430" y2="386" stroke="#35b779" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="430" y1="386" x2="430" y2="188" stroke="#35b779" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="445" y="292" fill="#7ff0a9" font-family="Georgia,serif" font-size="30" font-style="italic" font-weight="700">L</text>

  <!-- angle -->
  <path d="M400 235 A58 58 0 0 1 443 259" fill="none" stroke="#8bd7ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="448" y="249" fill="#fff" font-family="Georgia,serif" font-size="27" font-style="italic">θ</text>

  <!-- labels -->
  <rect x="54" y="120" width="148" height="72" rx="12" fill="#0b396b" stroke="#6dbcf0"/>
  <text x="70" y="148" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Grandezas</text>
  <text x="70" y="171" fill="#d9e8f7" font-family="Arial,sans-serif" font-size="14">L · θ · T · g</text>

  <rect x="575" y="112" width="165" height="82" rx="12" fill="#0b396b" stroke="#6dbcf0"/>
  <text x="592" y="141" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Medição</text>
  <text x="592" y="164" fill="#d9e8f7" font-family="Arial,sans-serif" font-size="14">smartphone + sensor</text>
  <text x="592" y="184" fill="#7ff0a9" font-family="Arial,sans-serif" font-size="14">período T</text>

  <rect x="42" y="470" width="716" height="26" rx="13" fill="#ffffff" fill-opacity=".10"/>
  <text x="400" y="489" text-anchor="middle" fill="#e9f4ff" font-family="Arial,sans-serif" font-size="14">Para pequenos ângulos:  T = 2π √(L/g)</text>
</svg>
