<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" role="img" aria-labelledby="title desc">
  <title id="title">Acelerômetro do smartphone</title>
  <desc id="desc">Esquema de um smartphone apoiado sobre uma superfície, mostrando os três eixos do acelerômetro X, Y e Z e o vetor da gravidade.</desc>
  <rect width="300" height="280" rx="24" fill="#061a46"/>
  <rect x="8" y="8" width="284" height="264" rx="18" fill="none" stroke="#2c91ff" stroke-opacity=".35"/>

  <text x="24" y="39" fill="#d9e8ff" font-family="Arial,sans-serif" font-size="16" font-weight="800">ACELERÔMETRO · X Y Z</text>

  <!-- smartphone -->
  <rect x="91" y="55" width="118" height="148" rx="18" fill="#0b4ea2" stroke="#61c9ff" stroke-width="5"/>
  <rect x="104" y="72" width="92" height="103" rx="10" fill="#0a77d8" opacity=".72"/>
  <circle cx="150" cy="190" r="4" fill="#d9e8ff"/>
  <rect x="136" y="62" width="28" height="5" rx="2.5" fill="#bfe7ff" opacity=".8"/>

  <!-- sensor chip -->
  <rect x="127" y="106" width="46" height="38" rx="7" fill="#061a46" stroke="#8be5ff" stroke-width="2"/>
  <circle cx="150" cy="125" r="7" fill="#72e2a1"/>
  <path d="M127 113h-8m8 8h-8m8 8h-8m8 8h-8M173 113h8m-8 8h8m-8 8h8m-8 8h8" stroke="#9fbce8" stroke-width="2"/>

  <!-- axes -->
  <path d="M150 125V82" stroke="#22d5ff" stroke-width="4"/>
  <path d="M150 82l-7 10m7-10 7 10" stroke="#22d5ff" stroke-width="3" fill="none"/>
  <text x="157" y="88" fill="#22d5ff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Y</text>

  <path d="M150 125H205" stroke="#72e2a1" stroke-width="4"/>
  <path d="M205 125l-10-7m10 7-10 7" stroke="#72e2a1" stroke-width="3" fill="none"/>
  <text x="211" y="130" fill="#72e2a1" font-family="Arial,sans-serif" font-size="13" font-weight="700">X</text>

  <path d="M150 125L121 154" stroke="#fff" stroke-width="4"/>
  <path d="M121 154l4-11m-4 11 11-4" stroke="#fff" stroke-width="3" fill="none"/>
  <text x="103" y="166" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Z</text>

  <!-- support and gravity -->
  <path d="M70 216H230" stroke="#9fbce8" stroke-width="5" stroke-linecap="round"/>
  <path d="M150 203V246" stroke="#ffcf70" stroke-width="4"/>
  <path d="M150 246l-8-12m8 12 8-12" stroke="#ffcf70" stroke-width="3" fill="none"/>
  <text x="158" y="244" fill="#ffcf70" font-family="Arial,sans-serif" font-size="12" font-weight="700">g</text>

  <text x="24" y="258" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Smartphone apoiado · leitura da gravidade</text>
</svg>