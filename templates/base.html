<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06245f">
  <title>{% block title %}Física Web{% endblock %}</title>
  <style>
    :root{--bg:#06183d;--panel:#0a2454;--text:#f5f9ff;--muted:#c8d7ee;--line:#315b9a;--accent:#20d4ff;--primary:#1478ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0b3d91 0,#06183d 48%,#030c20 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}a{color:var(--accent)}.container{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0 48px}.page-header{margin-bottom:28px}.eyebrow,.experiment-area{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.82rem}.page-header h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:.25rem 0 .75rem}.page-header p{color:var(--muted);max-width:760px}.experiment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.experiment-card{background:rgba(10,36,84,.9);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;min-height:280px;box-shadow:0 14px 35px rgba(0,0,0,.2)}.experiment-card h3{font-size:1.35rem;line-height:1.2;margin:.25rem 0 .65rem}.experiment-card p{color:var(--muted)}.experiment-card details{margin-top:auto;margin-bottom:16px}.experiment-card summary{cursor:pointer;font-weight:700}.button{display:inline-block;text-align:center;background:var(--primary);color:white;text-decoration:none;font-weight:800;padding:11px 16px;border-radius:11px}.button:focus,a:focus{outline:3px solid var(--accent);outline-offset:3px}li{margin:.4rem 0}@media(max-width:600px){.container{width:min(100% - 20px,1100px);padding-top:20px}.experiment-card{min-height:0}}
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
